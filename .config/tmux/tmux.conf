# General Settings
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",xterm-256color:Tc"
set -ga terminal-overrides '*:Ss=\E[%p1%d q:Se=\E[ q'
set -g status-position top
set -g mouse on
set -g cursor-style blinking-bar
set -g base-index 1
set -g pane-base-index 1
set -g renumber-windows on
set -g mode-keys vi
set -g mode-style "fg=white,bg=black"
set -g allow-passthrough on

# Keybinds
unbind C-b
set -g prefix C-a
bind C-a send-prefix
bind / split-window -h -c "#{pane_current_path}"
bind ? split-window -v -c "#{pane_current_path}"
bind -n -r C-S-h resize-pane -L 5
bind -n -r C-S-j resize-pane -D 5
bind -n -r C-S-k resize-pane -U 5
bind -n -r C-S-l resize-pane -R 5
bind -T copy-mode-vi WheelUpPane select-pane \; send -X -N 1 scroll-up
bind -T copy-mode-vi WheelDownPane select-pane \; send -X -N 1 scroll-down

# Plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'nordtheme/tmux'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'tmux-plugins/tmux-resurrect'

# Plugin settings
set -g @resurrect-processes '"~nvim->nvim" "claude->claude --continue"'
set -g @resurrect-strategy-nvim 'session'
set -g @resurrect-capture-pane-contents 'on'

run '~/.config/tmux/plugins/tpm/tpm'

# Hides the right side of the status bar after everything loads
set -g status-right ''
