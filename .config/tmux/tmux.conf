# Options
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",xterm-256color:Tc"
set -ga terminal-overrides '*:Ss=\E[%p1%d q:Se=\E[ q'
set -g status-position top
set -g mouse on
set -g cursor-style blinking-bar
set -g base-index 1
set -g pane-base-index 1
set -g renumber-windows on
set -g mode-keys vi
set -g mode-style "fg=white,bg=black"
set -g allow-passthrough on

# Plugin settings
set -g @resurrect-processes '"~nvim->nvim" "claude->claude --continue"'
set -g @resurrect-strategy-nvim 'session'
set -g @resurrect-capture-pane-contents 'on'
set -g @continuum-save-interval '15'
set -g @continuum-restore 'on'

# Plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'nordtheme/tmux'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

# Keymaps
unbind C-b
set -g prefix C-a
bind C-a send-prefix
bind / split-window -h -c "#{pane_current_path}"
bind ? split-window -v -c "#{pane_current_path}"
bind -n -r C-S-h resize-pane -L 5
bind -n -r C-S-j resize-pane -D 5
bind -n -r C-S-k resize-pane -U 5
bind -n -r C-S-l resize-pane -R 5

run '~/.config/tmux/plugins/tpm/tpm'

# nord-tmux overwrites status-right on load, so blank it afterwards
# while keeping tmux-continuum's (invisible) periodic-save hook.
set -g status-right "#(~/.config/tmux/plugins/tmux-continuum/scripts/continuum_save.sh)"
