# General Settings
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",xterm-256color:Tc"
set -ga terminal-overrides '*:Ss=\E[%p1%d q:Se=\E[ q'
set -g focus-events on
set -g mouse on
set -g cursor-style bar
set -g base-index 1
set -g pane-base-index 1
set -g renumber-windows on
set -g mode-keys vi
set -g mode-style "fg=white,bg=black"
set -g allow-passthrough on

# Keybinds
unbind C-b
set -g prefix C-a
bind C-a send-prefix
bind / split-window -h -c "#{pane_current_path}"
bind ? split-window -v -c "#{pane_current_path}"
bind -n -r C-S-h resize-pane -L 5
bind -n -r C-S-j resize-pane -D 5
bind -n -r C-S-k resize-pane -U 5
bind -n -r C-S-l resize-pane -R 5
bind -T copy-mode-vi WheelUpPane select-pane \; send -X -N 1 scroll-up
bind -T copy-mode-vi WheelDownPane select-pane \; send -X -N 2 scroll-down
bind j display-popup -E "tms"
bind u display-popup -E "tms switch"

# Plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'nordtheme/tmux'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'tmux-plugins/tmux-resurrect'

# Plugin settings
set -g @resurrect-processes '"~nvim->nvim" "claude->claude --continue"'
set -g @resurrect-strategy-nvim 'session'
set -g @resurrect-capture-pane-contents 'on'

run '~/.config/tmux/plugins/tpm/tpm'

# Status Bar
set -g status-justify right
set -g status-interval 1
set -g status-left-length 99
set -g status-right-length 99
set -g status-left '#(cat #{socket_path}-\#{session_id}-vimbridge)'
set -g status-right '#[fg=#2E3440,bg=#81A1C1] #S '
set -g window-status-separator ''
set -g window-status-format '#[fg=#D8DEE9,bg=#3B4252] #I #W '
set -g window-status-current-format '#[fg=#2E3440,bg=#88C0D0] #I #W '
